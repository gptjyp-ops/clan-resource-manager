name: Code checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/test-google.mjs
      - run: node scripts/test-clans.mjs
      - run: node scripts/test-clan-api.mjs
      - run: node scripts/test-screen-layout.mjs
      - run: node scripts/test-photo-input.mjs
      - run: node scripts/test-full-save.mjs
      - run: node scripts/test-drafts.mjs
      - run: node scripts/test-scan-diagnostics.mjs
      - run: node scripts/test-i18n.mjs
      - run: npm run check
      - run: npm run build
